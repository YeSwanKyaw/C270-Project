name: Node.js CI Pipeline

on:
  push:
    branches: [ "master" ] 
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Set the working directory since your Node app is inside the /web folder
    defaults:
      run:
        working-directory: ./web

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22' # Matches your Dockerfile environment
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install Dependencies
      run: npm ci

    - name: DevSecOps Vulnerability Scan
      run: npm audit --audit-level=high || true
      # The '|| true' prevents the pipeline from completely failing if a minor vulnerability is found, but still logs it for your presentation!

    - name: Application Syntax Check
      run: node --check app.js