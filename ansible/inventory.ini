# Answer and Conquer — Ansible inventory
#
# Local smoke test (same machine as Docker):
[bot_servers]
bot-api ansible_host=127.0.0.1 ansible_connection=local

# --- AWS EC2 example (uncomment and replace; comment out local host above) ---
# [bot_servers]
# bot-api ansible_host=ec2-xx-xx-xx-xx.ap-southeast-1.compute.amazonaws.com ansible_user=ubuntu
#
# Open TCP 3000 (web) and 5050 (bot) on the EC2 security group.

[bot_servers:vars]
ansible_python_interpreter=auto_silent
bot_port=5050
web_port=3000
bot_container_name=aac-bot-api
web_container_name=aac-web
